<script>
    $('#create_catalog_handler').on('submit', function (e) {
        e.preventDefault();
        let handlerTitle = $(this).find('#handler_title').val().trim();
        if (!handlerTitle) {
            return;
        }

        $('#addNewHandlerError').hide();

        sendAjax(
            '/handler/createCatalogHandler',
            {"handlerTitle": handlerTitle},
            function (status, response) {
                if (status === 'ERROR') {
                    $('#addNewHandlerError').text(response.message).show()

                    return;
                }

                sendAjax(
                    '/handler/handlersListSelectForHandler',
                    {
                        "handlerId"     : getCurrentHandlerId(),
                        "selectedOption": response.handlerId
                    },
                    function (status, response) {
                        if (status === 'ERROR') {

                        } else {
                            $("select[name='names[handler]']").replaceWith(response.html)
                            closeModule();
                            showAjaxNotifier(`Шаблон "${handlerTitle}" добавлен`);
                            hideAjaxNotifier(2000);
                        }
                    }
                )
            },
            {
                loadingStart: function () {
                    $('.form-ajax-loader').show();
                },
                loadingStop : function () {
                    $('.form-ajax-loader').hide();
                }
            }
        )
    });
